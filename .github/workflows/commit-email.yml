name: Send Commit Email

on:
  push:
    branches:
      - main   # masterブランチを使用している場合は master に変更してください

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v4
        with:
          # SMTP サーバー情報を書き換えてください。
          server_address: openxm.org
          server_port: 25
          secure: false
          ignore_cert: true  # 送信先のオレオレ証明書を受け付ける

          # メールの件名と送信先
          subject: "[GitHub] Push to ${{ github.repository }} by ${{ github.actor }}"
          to: openxm-01@openxm.org
          from: GitHub Actions <noreply@github.com>
          
          # メール本文
          body: |
            New push to ${{ github.repository }} 
            
            実行者: ${{ github.actor }}
            ブランチ: ${{ github.ref }}
            
            ▼ 変更内容の確認 (Compare)
            ${{ github.event.compare }}
            
            ▼ コミット履歴
            ${{ toJson(github.event.commits.*.message) }}
